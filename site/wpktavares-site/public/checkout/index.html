<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando para o Pagamento — Desafio 21 Dias</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/bOf9i1R.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c08;--surface:#101810;--green:#4caf50;--green-bright:#6dde71;--cream:#f0ead6;--muted:#7a9a7a;--border:rgba(76,175,80,0.18)}
body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:480px;width:100%}
.logo{width:56px;height:56px;border-radius:14px;border:1px solid var(--border);margin:0 auto 28px;display:block}
.badge{display:inline-block;background:rgba(76,175,80,0.1);border:1px solid var(--border);border-radius:100px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--green);padding:6px 18px;margin-bottom:24px}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,9vw,68px);line-height:.95;color:var(--cream);margin-bottom:14px}
h1 span{color:var(--green-bright);display:block}
.sub{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:40px}
/* Ring contador */
.ring-wrap{position:relative;width:96px;height:96px;margin:0 auto 32px}
.ring-bg{fill:none;stroke:rgba(76,175,80,.12);stroke-width:5}
.ring-fg{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:251.2;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--green-bright)}
.msgs{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:32px;min-height:56px;display:flex;align-items:center;justify-content:center}
.msg-text{font-size:14px;color:var(--muted);line-height:1.6;transition:opacity .4s}
.btn{display:block;width:100%;background:var(--green);color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;text-decoration:none;padding:17px 24px;border-radius:12px;border:none;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,background .2s}
.btn.visible{opacity:1;pointer-events:auto}
.btn:hover{background:var(--green-bright)}
.seguro{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <img src="https://i.imgur.com/bOf9i1R.png" alt="Logo" class="logo">
  <div class="badge">Pagamento Seguro</div>
  <h1>Quase lá,<br><span>Você fez a<br>escolha certa.</span></h1>
  <p class="sub">Estamos te redirecionando para o ambiente seguro de pagamento.<br>Não feche esta janela.</p>

  <div class="ring-wrap">
    <svg viewBox="0 0 96 96" width="96" height="96">
      <circle class="ring-bg" cx="48" cy="48" r="40"/>
      <circle class="ring-fg" id="ringFg" cx="48" cy="48" r="40"/>
    </svg>
    <div class="ring-num" id="ringNum">7</div>
  </div>

  <div class="msgs">
    <div class="msg-text" id="msgText">Preparando seu checkout...</div>
  </div>

  <a href="https://pay.cakto.com.br/a4po2eu_659401" class="btn" id="btnManual" target="_self">
    Ir para o pagamento agora →
  </a>

  <div class="seguro">🔒 Ambiente 100% seguro · Cakto Payments</div>
</div>

<script>
const CHECKOUT = 'https://pay.cakto.com.br/a4po2eu_659401';
const TOTAL    = 7;
const MSGS     = [
  'Preparando seu checkout...',
  'Verificando disponibilidade de vagas...',
  'Conectando ao ambiente seguro...',
  'Carregando sua oferta exclusiva...',
  'Quase lá — não feche a página...',
  'Redirecionando você agora...',
  'Abrindo página de pagamento...'
];

const ring   = document.getElementById('ringFg');
const num    = document.getElementById('ringNum');
const msg    = document.getElementById('msgText');
const btn    = document.getElementById('btnManual');
const circum = 2 * Math.PI * 40; // 251.2

let seconds = TOTAL;

function update() {
  const offset = circum * (1 - seconds / TOTAL);
  ring.style.strokeDashoffset = offset;
  num.textContent = seconds;
  msg.style.opacity = 0;
  setTimeout(() => {
    msg.textContent = MSGS[TOTAL - seconds] || MSGS[MSGS.length - 1];
    msg.style.opacity = 1;
  }, 200);

  if (seconds <= 3) btn.classList.add('visible');

  if (seconds === 0) {
    window.location.href = CHECKOUT;
    return;
  }
  seconds--;
  setTimeout(update, 1000);
}

update();
</script>
</body>
</html>
